<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administração - Perfumaria</title>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- PROTEÇÃO DA ÁREA ADMINISTRATIVA -->

    <script>

        if (sessionStorage.getItem("adminLogado") !== "true") {

            window.location.href = "login.html";

        }

    </script>


</head>


<body>


<header class="cabecalho">


    <div class="logo">

        <h1>
            Rede São José
        </h1>

        <p>
            Administração de Perfumaria
        </p>

    </div>


    <a
        href="admin.html"
        class="admin-voltar"
    >
        ← Voltar
    </a>


</header>



<main class="admin-produtos-container">


    <div class="admin-produtos-topo">


        <div>

            <h2>
                🌸 Perfumaria
            </h2>

            <p>
                Gerencie os produtos de perfumaria da farmácia.
            </p>

        </div>


        <a
            href="cadastrar-produto.html"
            class="admin-novo-produto"
        >
            + Cadastrar produto
        </a>


    </div>



    <div
        id="admin-lista-produtos"
        class="admin-lista-produtos"
    >

    </div>


</main>



<script src="script.js"></script>



<script>


/*
==========================================
MOSTRAR PRODUTOS DE PERFUMARIA
==========================================
*/


function mostrarProdutosAdmin() {


    const lista =
        document.getElementById(
            "admin-lista-produtos"
        );


    if (!lista) {
        return;
    }


    const produtosPerfumaria =
        produtos.filter(
            produto =>
                produto.categoria === "perfumaria"
        );


    lista.innerHTML = "";


    produtosPerfumaria.forEach(produto => {


        const card =
            document.createElement("div");


        card.className =
            "admin-produto-card";


        card.innerHTML = `

            <div class="admin-produto-imagem">

                <img
                    src="${produto.imagem}"
                    alt="${produto.nome}"
                >

            </div>


            <div class="admin-produto-info">


                <h3>
                    ${produto.nome}
                </h3>


                <p>
                    ${produto.descricao}
                </p>


                <strong>
                    R$ ${produto.preco
                        .toFixed(2)
                        .replace(".", ",")}
                </strong>


                <span
                    class="${
                        produto.disponivel
                            ? "produto-disponivel"
                            : "produto-indisponivel"
                    }"
                >

                    ${
                        produto.disponivel
                            ? "Disponível"
                            : "Indisponível"
                    }

                </span>


                <button
                    type="button"
                    class="botao-disponibilidade"
                    onclick="alterarDisponibilidade(${produto.id})"
                >

                    ${
                        produto.disponivel
                            ? "Marcar como indisponível"
                            : "Marcar como disponível"
                    }

                </button>


                <a
                    href="cadastrar-produto.html?editar=${produto.id}"
                    class="botao-disponibilidade"
                >
                    ✏️ Editar produto
                </a>


                <button
                    type="button"
                    class="botao-disponibilidade"
                    onclick="excluirProduto(${produto.id})"
                >
                    🗑️ Excluir produto
                </button>


            </div>

        `;


        lista.appendChild(card);


    });


}



/*
==========================================
ALTERAR DISPONIBILIDADE
==========================================
*/


function alterarDisponibilidade(id) {


    const produto =
        produtos.find(
            produto =>
                produto.id === id
        );


    if (!produto) {
        return;
    }


    produto.disponivel =
        !produto.disponivel;


    salvarProdutos();


    mostrarProdutosAdmin();


}



/*
==========================================
EXCLUIR PRODUTO
==========================================
*/


function excluirProduto(id) {


    const produto =
        produtos.find(
            produto =>
                produto.id === id
        );


    if (!produto) {
        return;
    }


    const confirmar =
        confirm(
            `Tem certeza que deseja excluir o produto "${produto.nome}"?\n\nEssa ação não poderá ser desfeita.`
        );


    if (!confirmar) {
        return;
    }


    const indice =
        produtos.findIndex(
            produto =>
                produto.id === id
        );


    if (indice === -1) {
        return;
    }


    produtos.splice(
        indice,
        1
    );


    salvarProdutos();


    mostrarProdutosAdmin();


    alert(
        "Produto excluído com sucesso!"
    );


}



/*
==========================================
INICIAR PÁGINA
==========================================
*/


mostrarProdutosAdmin();


</script>



</body>


</html>
